<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – Sell4Life</title>

    <link rel="icon" type="image/png" href="/assets/images/hero/favicon.png" />

    <link rel="stylesheet" href="/assets/css/auth.css?v=20260715c" />
    <script>
      window.__disableLayout = true;
    </script>
    <style id="s4l-fouc">html{visibility:hidden}</style>
  </head>
  <body class="s4l-loading">
    <div class="page-auth">
      <a href="/" class="auth-back">← Back to Home</a>

      <h2>Sign In</h2>

      <div class="auth-card signin-card">
        <form id="signinForm">
          <label for="email">Email</label>
          <input type="email" id="email" required />

          <label for="password">Password</label>
          <div class="pw-field-wrap">
            <input type="password" id="password" required />
            <button type="button" class="pw-toggle-btn" aria-label="Show password"></button>
          </div>

          <div style="text-align:right;margin-top:-4px;margin-bottom:8px">
            <a href="/account/forgot-password.html" style="font-size:13px;color:rgba(255,255,255,0.75);text-decoration:none">Forgot password?</a>
          </div>

          <button type="submit">Sign In</button>

          <p id="msg"></p>
        </form>
      </div>

      <div class="auth-switch">
        <span>Don’t have an account?</span>
        <a href="/account/register.html">Create one</a>
      </div>
    </div>

    <!-- Page scripts LAST -->

    <script src="/assets/js/config-global.js"></script>
    <script src="/assets/js/icons.js"></script>
    <script src="/assets/js/client-info.js"></script>

    <script>
      window.__pageScripts = ['/assets/js/password-toggle.js', '/assets/js/user-signin.js'];
    </script>
  </body>
</html>
