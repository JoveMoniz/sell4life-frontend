<!-- Global Font -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
/>

<!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/images/hero/favicon.png" />

<!-- =======================================================
     DESKTOP HEADER
======================================================= -->
<header class="s4l-header-desktop">
  <div class="header-container">
    <div class="desktop-header">
      <!-- Logo -->
      <a href="/" class="header-logo" style="display:inline-flex;align-items:center">
        <svg id="s4l-logo-desktop" xmlns="http://www.w3.org/2000/svg" height="30">
          <text id="s4l-logo-txt-d" y="22"
            font-family="Roboto,Arial,sans-serif"
            font-size="23" font-weight="900" letter-spacing="1.7">
            <tspan fill="#f18c28">$</tspan><tspan fill="#fff">ell</tspan><tspan fill="#f18c28">4</tspan><tspan fill="#fff">Life</tspan>
          </text>
        </svg>
      </a>

      <!-- Navigation -->
      <nav class="header-nav">
        <a href="/shop/">Buy</a>
        <a href="/sell/" id="nav-sell-desktop">Sell</a>
        <a href="/stores/">Stores</a>
      </nav>

      <!-- Search Bar -->
      <form id="desktop-search-form" class="header-search" role="search">
        <input
          id="desktop-search-input"
          type="text"
          placeholder="Search products..."
          autocomplete="off"
        />
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div class="search-autocomplete desktop-ac"></div>
      </form>

      <!-- Basket + Mini Cart -->

      <div class="header-icons">
        <div class="basket-wrapper">
          <div class="basket-shell" aria-label="Basket">
            <svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13C7 5 17 5 17 13"/><path d="M1 12H23V23Q23 27 19 27H5Q1 27 1 23V12Z"/></svg>
            <span class="basket-qty hide">0</span>
          </div>

          <div class="mini-cart">
            <ul class="mini-cart-items"></ul>

            <div class="mini-cart-total">
              <span class="mini-cart-total-label">Total:</span>
              <span class="mini-cart-total-value">£0.00</span>
            </div>

            <a href="/cart/cart.html" class="view-cart-btn">View Basket</a>
          </div>
        </div>

        <!-- account -->
        <div class="account-menu">
          <button type="button" id="accountBtnDesktop" class="account-avatar-btn" aria-label="Account" title="Account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          </button>

          <div class="account-dropdown" id="accountDropdownDesktop">
            <a href="/account/signin.html" class="auth dd-login">Sign in</a>
            <a href="/account/register.html" class="auth dd-register">Register</a>
            <a href="/account/orders.html" class="auth dd-orders">My Orders <span class="dd-order-badge"></span></a>
            <a href="/account/messages.html" class="auth dd-messages">My Messages <span class="dd-msg-badge"></span></a>
            <a href="/account/settings.html" class="auth dd-settings">Account Settings</a>
            <button type="button" class="dd-logout">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- =======================================================
     MOBILE + TABLET HEADER
======================================================= -->
<header class="s4l-header-mobile">
  <div class="mobile-header-container">
    <div class="mobile-header">
      <!-- Single row: favicon + search + hamburger (basket/account are handled by the sticky bottom bar on mobile) -->
      <div class="mobile-menu-col">
        <div class="mobile-search-row">
          <a href="/index.html" class="mobile-logo">
            <img src="/assets/images/hero/favicon.png" alt="Sell4Life" width="30" height="30" />
          </a>

          <form id="mobile-search-form" class="mobile-search" role="search">
            <input
              id="mobile-search-input"
              type="text"
              placeholder="Search products..."
              autocomplete="off"
            />
            <button type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <div class="search-autocomplete mobile-ac"></div>
          </form>

          <!-- Hamburger -->
          <button
            id="mobile-hamburger"
            class="mobile-hamburger"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <!-- Nav drawer — slides down when hamburger opens it -->
        <div id="mobile-nav-drawer" class="mobile-nav-drawer">
          <a href="/shop/">Buy</a>
          <a href="/sell/" id="nav-sell-mobile">Sell</a>
          <a href="/stores/">Stores</a>
        </div>
      </div>
    </div>
  </div>
</header>
